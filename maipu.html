<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1840">
<title>Club Maipú Pádel – Pagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#0a1840;--mid:#142c78;--gold:#f2b632;--ticket:#f7f8fc;--ink:#0d1838;--muted:#566083;--line:#cdd3e4;--ok:#1b8a5a;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--deep)}
body{margin:0;min-height:100vh;min-height:100dvh;color:#fff;font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:500;
background:radial-gradient(120% 70% at 50% 0%,#2a4aa8 0%,var(--mid) 38%,var(--deep) 100%) fixed;
padding:calc(30px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:440px;margin:0 auto}
.hero{text-align:center;padding:4px 6px 24px}
.logo{width:112px;height:112px;border-radius:50%;margin:0 auto 16px;display:block;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 5px var(--gold),0 14px 30px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1.1;letter-spacing:-.5px}
.sub{margin:0 auto;max-width:300px;font-size:16px;line-height:1.45;color:rgba(255,255,255,.8)}
[hidden]{display:none!important}
.choices{display:grid;gap:14px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:20px;padding:24px 22px;font:inherit;text-align:left;cursor:pointer;
background:var(--ticket);color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.28),0 16px 30px rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s}
.choice:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.28),0 8px 16px rgba(0,0,0,.25)}
.choice:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.choice b{display:block;font-size:30px;font-weight:800;letter-spacing:-.5px}
.choice span{display:block;margin-top:2px;font-size:15px;color:var(--muted)}
.choice svg{width:30px;height:30px;flex:none;color:var(--deep)}
.back{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 4px;border:0;background:none;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.back svg{width:20px;height:20px}
.shadow{filter:drop-shadow(0 22px 34px rgba(0,0,0,.4))}
.top,.bottom{background:var(--ticket);color:var(--ink);position:relative}
.top{border-radius:22px 22px 0 0;padding:26px 24px;
-webkit-mask:radial-gradient(circle 13px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat;
mask:radial-gradient(circle 13px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat}
.bottom{border-radius:0 0 22px 22px;padding:24px;
-webkit-mask:radial-gradient(circle 13px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat;
mask:radial-gradient(circle 13px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat}
.bottom::before{content:"";position:absolute;left:20px;right:20px;top:0;border-top:2px dashed var(--line)}
.tag{display:inline-block;margin:0 0 14px;padding:6px 14px;border-radius:30px;background:var(--deep);color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.3px}
.k{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--muted)}
.alias{margin:0 0 18px;font-weight:800;line-height:1.05;letter-spacing:-1px;font-size:clamp(28px,9vw,40px);word-break:break-all;user-select:all;-webkit-user-select:all}
.titular{margin:0 0 22px;font-size:19px;font-weight:700;line-height:1.25}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;border:0;border-radius:16px;padding:19px 18px;font:inherit;font-size:19px;font-weight:800;background:var(--deep);color:var(--gold);cursor:pointer;
box-shadow:0 8px 0 #000a,0 14px 26px rgba(10,24,64,.35);transition:transform .12s,box-shadow .12s,background .2s,color .2s}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #000a,0 6px 14px rgba(10,24,64,.3)}
.btn svg{width:22px;height:22px;flex:none}
.btn.done{background:var(--ok);color:#fff}
.hint{min-height:20px;margin:14px 2px 0;font-size:13.5px;color:var(--muted);text-align:center}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:center;font-size:15px;line-height:1.4}
.n{width:32px;height:32px;border-radius:50%;background:var(--deep);color:var(--gold);display:grid;place-items:center;font-size:14px;font-weight:800}
@media (prefers-reduced-motion:reduce){.choice,.btn{transition:none}}
</style>
</head>

    <h1>Club Maipú Pádel</h1>
    <p class="sub" id="sub">Elegí tu cancha para ver el alias de pago.</p>
  </header>

  <section id="pick" class="choices" aria-label="Elegí tu cancha">
    <button class="choice" type="button" data-court="indoor">
      <div><b>Indoor</b><span>Canchas cubiertas</span></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="choice" type="button" data-court="outdoor">
      <div><b>Outdoor</b><span>Canchas al aire libre</span></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </section>

  <section id="detail" hidden>
    <button class="back" id="back" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Cambiar cancha
    </button>
    <div class="shadow">
      <div class="top">
        <span class="tag" id="tag"></span>
        <p class="k">Alias</p>
        <p class="alias" id="alias"></p>
        <p class="k">Titular de la cuenta</p>
        <p class="titular" id="titular"></p>
        <button class="btn" id="btn" type="button">
          <svg id="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"/></svg>
          <span id="btnText">Copiar alias</span>
        </button>
        <p class="hint" id="hint" role="status" aria-live="polite"></p>
      </div>
      <div class="bottom">
        <ol class="steps">
          <li><span class="n">1</span><span><b>Copiá</b> el alias con el botón.</span></li>
          <li><span class="n">2</span><span>Abrí tu billetera o banco y elegí <b>Transferir</b>.</span></li>
          <li><span class="n">3</span><span><b>Pegá</b> el alias, revisá el titular, poné el monto y confirmá.</span></li>
        </ol>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  var COURTS={
    indoor:{tag:"CANCHAS INDOOR",alias:"Maipu.padel",titular:"Mariano Adolfo Fernández"},
    outdoor:{tag:"CANCHAS OUTDOOR",alias:"Padel.maipu",titular:"Alba Inés Rocco"}
  };
  var $=function(id){return document.getElementById(id)};
  var pick=$("pick"),detail=$("detail"),sub=$("sub"),btn=$("btn"),txt=$("btnText"),hint=$("hint"),ico=$("ico"),aliasEl=$("alias");
  var COPY=ico.innerHTML,CHECK='<path d="M5 12.5l4.5 4.5L19 7.5"/>',timer,current=null;
  function reset(){clearTimeout(timer);txt.textContent="Copiar alias";btn.className="btn";ico.innerHTML=COPY;hint.textContent=""}
  function show(key,push){
    var c=COURTS[key];if(!c){return home(false)}
    current=c;reset();
    $("tag").textContent=c.tag;aliasEl.textContent=c.alias;$("titular").textContent=c.titular;
    pick.hidden=true;detail.hidden=false;sub.textContent="Transferí a la cuenta de las canchas "+(key==="indoor"?"indoor":"outdoor")+".";
    if(push){try{history.replaceState(null,"","#"+key)}catch(e){}}
    window.scrollTo(0,0);
  }
  function home(push){
    current=null;detail.hidden=true;pick.hidden=false;sub.textContent="Elegí tu cancha para ver el alias de pago.";
    if(push){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
  }
  pick.addEventListener("click",function(e){var b=e.target.closest("[data-court]");if(b){show(b.getAttribute("data-court"),true)}});
  $("back").addEventListener("click",function(){home(true)});
  function ok(){
    clearTimeout(timer);txt.textContent="¡Copiado!";btn.className="btn done";ico.innerHTML=CHECK;
    hint.textContent="Ahora abrí tu billetera o banco y pegalo en Transferir.";
    timer=setTimeout(reset,3500);
  }
  function fallback(){
    var ta=document.createElement("textarea");ta.value=current.alias;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
    var done=false;try{done=document.execCommand("copy")}catch(e){}
    document.body.removeChild(ta);
    if(done){ok()}else{var r=document.createRange();r.selectNodeContents(aliasEl);var s=getSelection();s.removeAllRanges();s.addRange(r);hint.textContent="Mantené apretado el alias y elegí Copiar."}
  }
  btn.addEventListener("click",function(){
    if(!current){return}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(current.alias).then(ok,fallback)}else{fallback()}
  });
  var h=(location.hash||"").replace(/^#/,"").toLowerCase();
  if(COURTS[h]){show(h,false)}
})();
</script>
</body>
